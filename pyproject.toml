[project]
name = "tech-news-graphrag"
version = "0.1.0"
description = "GraphRAG pipeline for tech-news — vector + knowledge-graph retrieval with FastAPI"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # --- Web framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # --- Database: PostgreSQL + pgvector ---
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",       # for Alembic sync migrations

    # --- Graph database: Neo4j ---
    "neo4j>=5.20.0",

    # --- Embeddings ---
    "openai>=1.30.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",

    # --- LLM providers ---
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",

    # --- Data ingestion ---
    "datasets>=2.19.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",

    # --- Text processing & chunking ---
    "langchain-text-splitters>=0.2.0",
    "nltk>=3.8.1",

    # --- Retrieval & reranking ---
    "cohere>=5.5.0",
    "rank-bm25>=0.2.2",

    # --- Observability ---
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.20.0",

    # --- Config & utilities ---
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "tqdm>=4.66.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",           # for TestClient
    "factory-boy>=3.3.0",
    "faker>=25.3.0",
    "mypy>=1.10.0",
    "ruff>=0.4.7",
    "pre-commit>=3.7.1",
]

eval = [
    "ragas>=0.1.14",
    "pandas>=2.2.2",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag"]

# ---------- Tool configs ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src/graphrag --cov-report=term-missing"

[tool.coverage.run]
source = ["src/graphrag"]
omit = ["*/tests/*", "*/migrations/*"]
