logging:
  level: INFO               # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: json              # json | text
  output: stdout            # stdout | file | both

  file:
    path: logs/graphrag.log
    max_bytes: 10485760     # 10 MB
    backup_count: 5

  loggers:
    uvicorn: WARNING
    sqlalchemy.engine: WARNING
    neo4j: WARNING
    httpx: WARNING
    openai: INFO
